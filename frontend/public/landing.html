<body>

  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

: clamp(44px, 6.2vw, 84px); line-height: 1.04; font-weight: 300; letter-spacing: -0.025em\">\n<span class=\"rise\" style=\"display: inline-block; animation-delay: 200ms; margin-right: 0.28em\">Context<\u002Fspan>\n<span class=\"rise\" style=\"display: inline-block; animation-delay: 300ms; margin-right: 0.28em\">your<\u002Fspan>\n<span class=\"rise\" style=\"display: inline-block; animation-delay: 400ms; margin-right: 0.28em\">AI<\u002Fspan>\n<span class=\"rise\" style=\"display: inline-block; animation-delay: 500ms; margin-right: 0.28em\">can<\u002Fspan>\n<span class=\"rise grad-dark\" style=\"display: inline-block; animation-delay: 650ms; font-weight: 800\">prove.<\u002Fspan>\n<\u002Fh1>\n<p class=\"rise\" style=\"margin: 0; font-size: 19px; max-width: 540px; color: #d9d8d8; animation-delay: 800ms\">ORBIT selects the right business context for every request your AI agents make — and shows you why each piece was kept or left out.<\u002Fp>\n<p class=\"rise\" style=\"margin: 0; font-size: 14px; font-weight: 500; color: #b5b4b4; animation-delay: 900ms\"><strong style=\"font-weight: 700; color: #ffffff\">O<\u002Fstrong>rchestrated <strong style=\"font-weight: 700; color: #ffffff\">R<\u002Fstrong>etrieval for <strong style=\"font-weight: 700; color: #ffffff\">B<\u002Fstrong>usiness <strong style=\"font-weight: 700; color: #ffffff\">I<\u002Fstrong>nformation &amp; <strong style=\"font-weight: 700; color: #ffffff\">T<\u002Fstrong>raceability<\u002Fp>\n<div class=\"rise\" style=\"display: flex; gap: 16px; flex-wrap: wrap; padding-top: 8px; animation-delay: 1000ms\">\n<a class=\"btn btn-primary\" href=\"#contact\" style=\"display: inline-flex; align-items: center; gap: 10px; min-height: 54px; padding: 0 32px; border-radius: 60px; background: #d6304a; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 16px; box-shadow: 0 0 28px rgba(248,72,94,0.35)\">Book a demo\n<svg aria-hidden=\"true\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\ #f8485e\">·<\u002Fspan><span>Business rules<\u002Fspan><span style=\"color: #f8485e\">·<\u002Fspan><span>Agent memory<\u002Fspan><span style=\"color: #f8485e\">·<\u002Fspan><span>Access-aware<\u002Fspan><span style=\"color: #f8485e\">·<\u002Fspan><span>Versioned sources<\u002Fspan><span style=\"color: #f8485e\">·<\u002Fspan><span>Audit-ready<\u002Fspan><span style=\"color: #f8485e\">·<\u002Fspan>\n<span>Hybrid search<\u002Fspan><span style=\"color: #f8485e\">·<\u002Fspan><span>Reranking<\u002Fspan><span style=\"color: #f8485e\">·<\u002Fspan><span>Business rules<\u002Fspan><span style=\"color: #f8485e\">·<\u002Fspan><span>Agent memory<\u002Fspan><span style=\"color: #f8485e\">·<\u002Fspan><span>Access-aware<\u002Fspan><span style=\"color: #f8485e\">·<\u002Fspan><span>Versioned sources<\u002Fspan><span style=\"color: #f8485e\">·<\u002Fspan><span>Audit-ready<\u002Fspan><span style=\"color: #f8485e\">·<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PRINCIPLES / BENTO -->\n<section id=\"principles\" style=\"background: #ffffff\">\n<div style=\"max-width: 1280px; margin: 0 auto; padding: 128px 24px; display: flex; flex-direction: column; gap: 56px\">\n<div class=\"reveal\" style=\"display: flex; flex-direction: column; gap: 16px; max-width: 780px\">\n<div style=\"font-size: 14px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #c42a40\">What O.R.B.I.T. stands for<\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(32px, 4vw, 54px); line-height: 1.12; font-weight: 300; letter-spacing: -0.02em\">Five principles, <span style=\"font-weight: 700\">one chain<\u002Fspan> of context.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px\">Each letter is a step on the path from your business data to your agents’ answers.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 20px\">\n\n<article class=\"lift reveal\" style=\"background: #efeeee; border-radius: 15px; padding: 32px; display: flex; flex-direction: column; gap: 14px; min-height: 280px\">\n<div class=\"grad-light\" style=\"font-size: 88px; line-height: 1; font-weight: 800; align-self: flex-start\">O<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 24px; line-height: 1.35; font-weight: 600; margin-top: auto\">Orchestrated<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">Multiple sources, rules, memories and agents work in one coordinated flow — not queried one by one.<\u002Fp>\n<\u002Farticle>\n\n<article class=\"lift reveal\" style=\"background: #efeeee; border-radius: 15px; padding: 32px; display: flex; flex-direction: column; gap: 14px; min-height: 280px\">\n<div class=\"grad-light\" style=\"font-size: 88px; line-height: 1; font-weight: 800; align-self: flex-start\">R<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 24px; line-height: 1.35; font-weight: 600; margin-top: auto\">Retrieval<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">Hybrid search (keyword and vector), reranking, then selection of the context the request really needs.<\u002Fp>\n<\u002Farticle>\n\n<article class=\"lift reveal\" style=\"background: #efeeee; border-radius: 15px; padding: 32px; display: flex; flex-direction: column; gap: 14px; min-height: 280px\">\n<div class=\"grad-light\" style=\"font-size: 88px; line-height: 1; font-weight: 800; align-self: flex-start\">B<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 24px; line-height: 1.35; font-weight: 600; margin-top: auto\">Business<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">Your data, decisions, constraints and domain knowledge drive selection — not semantic similarity alone.<\u002Fp>\n<\u002Farticle>\n\n<article class=\"lift reveal\" style=\"background: #efeeee; border-radius: 15px; padding: 32px; display: flex; flex-direction: column; gap: 14px; min-height: 280px\">\n<div class=\"grad-light\" style=\"font-size: 88px; line-height: 1; font-weight: 800; align-self: flex-start\">I<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 24px; line-height: 1.35; font-weight: 600; margin-top: auto\">Information<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">Raw sources become usable context: chunked, normalised, enriched and ready for a model.<\u002Fp>\n<\u002Farticle>\n\n<article class=\"reveal\" style=\"position: relative; overflow: hidden; background: #0f0f0f; color: #ffffff; border-radius: 25px; padding: clamp(32px, 4vw, 48px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 32px; align-items: end; grid-column: 1 / -1; min-width: 0\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<div class=\"grad-dark\" style=\"font-size: 120px; line-height: 0.9; font-weight: 800; align-self: flex-start\">T<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 32px; line-height: 1.25; font-weight: 600\">Traceability<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; color: #d9d8d8; max-width: 560px\">Provenance, versions, access rights, inclusion and exclusion decisions, audit: every piece of context stays accountable, from source to answer.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-start\">\n<span style=\"font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.22)\">Provenance<\u002Fspan>\n<span style=\"font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.22)\">Versions<\u002Fspan>\n<span style=\"font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.22)\">ACL<\u002Fspan>\n<span style=\"font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.22)\">Inclusion / exclusion<\u002Fspan>\n<span style=\"font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.22)\">Audit<\u002Fspan>\n<\u002Fdiv>\n<\u002Farticle>\n\n<\u002Fdiv>\n<\u002Fdiv>\n " stroke-linejoin=\"round\"><ellipse cx=\"12\" cy=\"5\" rx=\"8\" ry=\"3\"><\u002Fellipse><path d=\"M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5\"><\u002Fpath><path d=\"M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"font-size: 14px; font-weight: 700; color: #c42a40\">01<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; line-height: 1.4; font-weight: 500\">Connect sources<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Documents, databases, reference data, agent memories: each source arrives with its metadata and access rights.<\u002Fp>\n<\u002Fli>\n<li class=\"lift reveal\" style=\"background: #ffffff; border-radius: 15px; padding: 28px 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 10px rgba(60,60,58,0.06)\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<span style=\"display: inline-flex; width: 48px; height: 48px; align-items: center; justify-content: center; border-radius: 12px; background: #efeeee\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3c3c3a\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><circle cx=\"4\" cy=\"5\" r=\"2\"><\u002Fcircle><circle cx=\"20\" cy=\"5\" r=\"2\"><\u002Fcircle><circle cx=\"12\" cy=\"21\" r=\"2\"><\u002Fcircle><path d=\"M5.6 6.4 9.8 10\"><\u002Fpath><path d=\"M18.4 6.4 14.2 10\"><\u002Fpath><path d=\"M12 15v4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"font-size: 14px; font-weight: 700; color: #c42a40\">02<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; line-height: 1.4; font-weight: 500\">Orchestrate<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">ORBIT routes each request to the right sources and applies your business rules before any search runs.<\u002Fp>\n<\u002Fli>\n<li class=\"lift reveal\" style=\"background: #ffffff; border-radius: 15px; padding: 28px 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 10px rgba(60,60,58,0.06)\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<span style=\"display: inline-flex; width: 48px; height: 48px; align-items: center; justify-content: center; border-radius: 12px; background: #efeeee\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3c3c3a\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><path d=\"M8 11h6\"><\u002Fpath><path d=\"M11 8v6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"font-size: 14px; font-weight: 700; color: #c42a40\">03<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; line-height: 1.4; font-weight: 500\">Search and rerank<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Hybrid search, then reranking, keeps only the most relevant passages.<\u002Fp>\n<\u002Fli>\n<li class=\"lift reveal\" style=\"background: #ffffff; border-radius: 15px; padding: 28px 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 10px rgba(60,60,58,0.06)\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<span style=\"display: inline-flex; width: 48px; height: 48px; align-items: center; justify-content: center; border-radius: 12px; background: #efeeee\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3c3c3a\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18\"><\u002Fpath><path d=\"M6 12h12\"><\u002Fpath><path d=\"M10 18h4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"font-size: 14px; font-weight: 700; color: #c42a40\">04<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; line-height: 1.4; font-weight: 500\">Build the context<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Selected passages are filtered by access rights and version, then assembled into model-ready context.<\u002Fp>\n<\u002Fli>\n<li class=\"lift reveal\" style=\"background: #ffffff; border-radius: 15px; padding: 28px 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 10px rgba(60,60,58,0.06)\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<span style=\"display: inline-flex; width: 48px; height: 48px; align-items: center; justify-content: center; border-radius: 12px; background: #fddade\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#c42a40\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"><\u002Fpath><path d=\"M14 3v6h6\"><\u002Fpath><path d=\"m9 15 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"font-size: 14px; font-weight: 700; color: #c42a40\">05<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; line-height: 1.4; font-weight: 500\">Trace and audit<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Every inclusion and exclusion decision is logged and open to review afterwards.<\u002Fp>\n<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- TRACEABILITY -->\n<section id=\"traceability\" style=\"background: #ffffff\">\n<div style=\"max-width: 1280px; margin: 0 auto; padding: 128px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 72px; align-items: center\">\n<div class=\"reveal\" style=\"display: flex; flex-direction: column; gap: 24px\">\n<div style=\"font-size: 14px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #c42a40\">Traceability<\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(32px, 4vw, 54px); line-height: 1.12; font-weight: 300; letter-spacing: -0.02em\">Every answer comes with <span class=\"grad-light\" style=\"font-weight: 800\">its evidence<\u002Fspan>.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px\">Your compliance, security and business teams see exactly what the agent read, in which version, and why everything else was left out.<\u002Fp>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px\">\n<li style=\"display: grid; grid-template-columns: 28px 1fr; gap: 14px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#c42a40\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-top: 3px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><div><strong style=\"font-weight: 600\">Provenance<\u002Fstrong> — the source, passage and access path of every element.<\u002Fdiv><\u002Fli>\n<li style=\"display: grid; grid-template-columns: 28px 1fr; gap: 14px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#c42a40\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-top: 3px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><div><strong style=\"font-weight: 600\">Versions<\u002Fstrong> — the exact document used, even after it changes.<\u002Fdiv><\u002Fli>\n<li style=\"display: grid; grid-template-columns: 28px 1fr; gap: 14px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#c42a40\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-top: 3px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><div><strong style=\"font-weight: 600\">ACL<\u002Fstrong> — the user’s access rights applied before anything reaches the model.<\u002Fdiv><\u002Fli>\n<li style=\"display: grid; grid-template-columns: 28px 1fr; gap: 14px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#c42 lex-direction: column; gap: 14px; min-height: 280px\">\n<div class=\"grad-light\" style=\"font-size: 88px; line-height: 1; font-weight: 800; align-self: flex-start\">O<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 24px; line-height: 1.35; font-weight: 600; margin-top: auto\">Orchestrated<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">Multiple sources, rules, memories and agents work in one coordinated flow — not queried one by one.<\u002Fp>\n<\u002Farticle>\n\n<article class=\"lift reveal\" style=\"background: #efeeee; border-radius: 15px; padding: 32px; display: flex; flex-direction: column; gap: 14px; min-height: 280px\">\n<div class=\"grad-light\" style=\"font-size: 88px; line-height: 1; font-weight: 800; align-self: flex-start\">R<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 24px; line-height: 1.35; font-weight: 600; margin-top: auto\">Retrieval<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">Hybrid search (keyword and vector), reranking, then selection of the context the request really needs.<\u002Fp>\n<\u002Farticle>\n\n<article class=\"lift reveal\" style=\"background: #efeeee; border-radius: 15px; padding: 32px; display: flex; flex-direction: column; gap: 14px; min-height: 280px\">\n<div class=\"grad-light\" style=\"font-size: 88px; line-height: 1; font-weight: 800; align-self: flex-start\">B<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 24px; line-height: 1.35; font-weight: 600; margin-top: auto\">Business<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">Your data, decisions, constraints and domain knowledge drive selection — not semantic similarity alone.<\u002Fp>\n<\u002Farticle>\n\n<article class=\"lift reveal\" style=\"background: #efeeee; border-radius: 15px; padding: 32px; display: flex; flex-direction: column; gap: 14px; min-height: 280px\">\n<div class=\"grad-light\" style=\"font-size: 88px; line-height: 1; font-weight: 800; align-self: flex-start\">I<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 24px; line-height: 1.35; font-weight: 600; margin-top: auto\">Information<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">Raw sources become usable context: chunked, normalised, enriched and ready for a model.<\u002Fp>\n<\u002Farticle>\n\n<article class=\"reveal\" style=\"position: relative; overflow: hidden; background: #0f0f0f; color: #ffffff; border-radius: 25px; padding: clamp(32px, 4vw, 48px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 32px; align-items: end; grid-column: 1 / -1; min-width: 0\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<div class=\"grad-dark\" style=\"font-size: 120px; line-height: 0.9; font-weight: 800; align-self: flex-start\">T<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 32px; line-height: 1.25; font-weight: 600\">Traceability<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; color: #d9d8d8; max-width: 560px\">Provenance, versions, access rights, inclusion and exclusion decisions, audit: every piece of context stays accountable, from source to answer.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-start\">\n<span style=\"font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.22)\">Provenance<\u002Fspan>\n<span style=\"font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.22)\">Versions<\u002Fspan>\n<span style=\"font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.22)\">ACL<\u002Fspan>\n<span style=\"font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.22)\">Inclusion / exclusion<\u002Fspan>\n<span style=\"font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.22)\">Audit<\u002Fspan>\n<\u002Fdiv>\n<\u002Farticle>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"how-it-works\" style=\"background: #efeeee\">\n<div style=\"max-width: 1280px; margin: 0 auto; padding: 128px 24px; display: flex; flex-direction: column; gap: 64px\">\n<div class=\"reveal\" style=\"display: flex; flex-direction: column; gap: 16px; max-width: 780px\">\n<div style=\"font-size: 14px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #c42a40\">How it works<\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(32px, 4vw, 54px); line-height: 1.12; font-weight: 300; letter-spacing: -0.02em\">From source to answer, <span style=\"font-weight: 700\">in five steps<\u002Fspan>.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px\">Your agents get less context, but the right context — and you keep a record of every choice.<\u002Fp>\n<\u002Fdiv>\n<div style=\"position: relative\">\n<div class=\"track\" aria-hidden=\"true\" style=\"position: absolute; left: 4%; right: 4%; top: 52px; height: 2px; background: #dcdbdb\">\n<div class=\"travel\" style=\"position: absolute; top: -5px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #f8485e; box-shadow: 0 0 16px 4px rgba(248,72,94,0.55)\"><\u002Fdiv>\n<\u002Fdiv>\n<ol style=\"position: relative; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 20px\">\n<li class=\"lift reveal\" style=\"background: #ffffff; border-radius: 15px; padding: 28px 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 10px rgba(60,60,58,0.06)\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<span style=\"display: inline-flex; width: 48px; height: 48px; align-items: center; justify-content: center; border-radius: 12px; background: #efeeee\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3c3c3a\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><ellipse cx=\"12\" cy=\"5\" rx=\"8\" ry=\"3\"><\u002Fellipse><path d=\"M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5\"><\u002Fpath><path d=\"M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"font-size: 14px; font-weight: 700; color: #c42a40\">01<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; line-height: 1.4; font-weight: 500\">Connect sources<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Documents, databases, reference data, agent memories: each source arrives with its metadata and access rights.<\u002Fp>\n<\u002Fli>\n<li class=\"lift reveal\" style=\"background: #ffffff; border-radius: 15px; padding: 28px 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 10px rgba(60,60,58,0.06)\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<span style=\"display: inline-flex; width: 48px; height: 48px; align-items: center; justify-content: center; border-radius: 12px; background: #efeeee\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3c3c3a\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><circle cx=\"4\" cy=\"5\" r=\"2\"><\u002Fcircle><circle cx=\"20\" cy=\"5\" r=\"2\"><\u002Fcircle><circle cx=\"12\" cy=\"21\" r=\"2\"><\u002Fcircle><path d=\"M5.6 6.4 9.8 10\"><\u002Fpath><path d=\"M18.4 6.4 14.2 10\"><\u002Fpath><path d=\"M12 15v4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"font-size: 14px; font-weight: 700; color: #c42a40\">02<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; line-height: 1.4; font-weight: 500\">Orchestrate<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">ORBIT routes each request to the right sources and applies your business rules before any search runs.<\u002Fp>\n<\u002Fli>\n<li class=\"lift reveal\" style=\"background: #ffffff; border-radius: 15px; padding: 28px 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 10px rgba(60,60,58,0.06)\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<span style=\"display: inline-flex; width: 48px; height: 48px; align-items: center; justify-content: center; border-radius: 12px; background: #efeeee\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3c3c3a\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><path d=\"M8 11h6\"><\u002Fpath><path d=\"M11 8v6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"font-size: 14px; font-weight: 700; color: #c42a40\">03<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; line-height: 1.4; font-weight: 500\">Search and rerank<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Hybrid search, then reranking, keeps only the most relevant passages.<\u002Fp>\n<\u002Fli>\n<li class=\"lift reveal\" style=\"background: #ffffff; border-radius: 15px; padding: 28px 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 10px rgba(60,60,58,0.06)\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<span style=\"display: inline-flex; width: 48px; height: 48px; align-items: center; justify-content: center; border-radius: 12px; background: #efeeee\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3c3c3a\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18\"><\u002Fpath><path d=\"M6 12h12\"><\u002Fpath><path d=\"M10 18h4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"font-size: 14px; font-weight: 700; color: #c42a40\">04<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; line-height: 1.4; font-weight: 500\">Build the context<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Selected passages are filtered by access rights and version, then assembled into model-ready context.<\u002Fp>\n<\u002Fli>\n<li class=\"lift reveal\" style=\"background: #ffffff; border-radius: 15px; padding: 28px 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 10px rgba(60,60,58,0.06)\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<span style=\"display: inline-flex; width: 48px; height: 48px; align-items: center; justify-content: center; border-radius: 12px; background: #fddade\"><svg aria-hidden=\"true\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#c42a40\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"><\u002Fpath><path d=\"M14 3v6h6\"><\u002Fpath><path d=\"m9 15 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"font-size: 14px; font-weight: 700; color: #c42a40\">05<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 20px; line-height: 1.4; font-weight: 500\">Trace and audit<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Every inclusion and exclusion decision is logged and open to review afterwards.<\u002Fp>\n<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"traceability\" style=\"background: #ffffff\">\n<div style=\"max-width: 1280px; margin: 0 auto; padding: 128px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 72px; align-items: center\">\n<div class=\"reveal\" style=\"display: flex; flex-direction: column; gap: 24px\">\n<div style=\"font-size: 14px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #c42a40\">Traceability<\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(32px, 4vw, 54px); line-height: 1.12; font-weight: 300; letter-spacing: -0.02em\">Every answer comes with <span class=\"grad-light\" style=\"font-weight: 800\">its evidence<\u002Fspan>.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px\">Your compliance, security and business teams see exactly what the agent read, in which version, and why everything else was left out.<\u002Fp>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px\">\n<li style=\"display: grid; grid-template-columns: 28px 1fr; gap: 14px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#c42a40\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-top: 3px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><div><strong style=\"font-weight: 600\">Provenance<\u002Fstrong> — the source, passage and access path of every element.<\u002Fdiv><\u002Fli>\n<li style=\"display: grid; grid-template-columns: 28px 1fr; gap: 14px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#c42a40\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-top: 3px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><div><strong style=\"font-weight: 600\">Versions<\u002Fstrong> — the exact document used, even after it changes.<\u002Fdiv><\u002Fli>\n<li style=\"display: grid; grid-template-columns: 28px 1fr; gap: 14px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#c42a40\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-top: 3px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><div><strong style=\"font-weight: 600\">ACL<\u002Fstrong> — the user’s access rights applied before anything reaches the model.<\u002Fdiv><\u002Fli>\n<li style=\"display: grid; grid-template-columns: 28px 1fr; gap: 14px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#c42a40\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-top: 3px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><div><strong style=\"font-weight: 600\">Inclusion / exclusion<\u002Fstrong> — a human-readable reason for every choice.<\u002Fdiv><\u002Fli>\n<li style=\"display: grid; grid-template-columns: 28px 1fr; gap: 14px\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#c42a40\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-top: 3px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><div><strong style=\"font-weight: 600\">Audit<\u002Fstrong> — a time-stamped log you can export for reviews.<\u002Fdiv><\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n\n<div class=\"reveal\" style=\"border-radius: 15px; border: 1px solid #e2e1e1; overflow: hidden; box-shadow: 0 20px 50px rgba(60,60,58,0.10); background: #ffffff\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; background: #efeeee; gap: 12px; flex-wrap: wrap\">\n<div style=\"display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase\"><span class=\"live\" style=\"width: 8px; height: 8px; border-radius: 50%; background: #5ab891\"><\u002Fspan>Audit log · example<\u002Fdiv>\n<span style=\"font-size: 12px; font-weight: 500; color: #5c5c5a\">Request #[ID]<\u002Fspan>\n<\u002Fdiv>\n<div style=\"overflow-x: auto\">\n<table style=\"width: 100%; border-collapse: collapse; font-size: 14px; min-width: 480px\">\n<thead>\n<tr style=\"text-align: left; border-bottom: 1px solid #e2e1e1\">\n<th style=\"padding: 14px 22px; font-weight: 600\">Element<\u002Fth>\n<th style=\"padding: 14px 12px; font-weight: 600\">Version<\u002Fth>\n<th style=\"padding: 14px 12px; font-weight: 600\">Decision<\u002Fth>\n<th style=\"padding: 14px 22px; font-weight: 600\">Reason<\u002Fth>\n<\u002Ftr>\n<\u002Fthead>\n<tbody>\n<tr style=\"border-bottom: 1px solid #efeeee\">\n<td style=\"padding: 14px 22px; font-weight: 500\">Framework agreement §14<\u002Ftd>\n<td style=\"p
